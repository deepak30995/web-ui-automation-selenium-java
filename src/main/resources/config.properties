# ========================================
# EXECUTION MODE CONFIGURATION
# ========================================
# Options: local, remote, browserstack, lambdatest, saucelabs, aws
execution.mode=local

# ========================================
# BROWSER CONFIGURATION
# ========================================
browser=chrome
# Options: chrome, firefox, edge, safari (safari only works locally on macOS)
headless=false

# ========================================
# LOCAL/REMOTE GRID CONFIGURATION
# ========================================
selenium.hub.url=http://localhost:4444/wd/hub

# ========================================
# CLOUD PLATFORM CREDENTIALS
# ========================================
# BrowserStack
browserstack.username=your_username_here
browserstack.accesskey=your_access_key_here

# LambdaTest
lambdatest.username=your_username_here
lambdatest.accesskey=your_access_key_here

# Sauce Labs
saucelabs.username=your_username_here
saucelabs.accesskey=your_access_key_here

# AWS Device Farm
aws.devicefarm.url=your_aws_device_farm_url_here

# ========================================
# BROWSER/PLATFORM SPECIFICATIONS
# ========================================
browser.version=latest
os.name=OS X
os.version=Monterey
platform.name=macOS Sequoia

# ========================================
# APPLICATION CONFIGURATION
# ========================================
base.url=https://deepak30995.graphy.com/
environment=Staging

# ========================================
# PROJECT INFORMATION
# ========================================
project.name=Selenium POM Framework
build.name=Build-1.0

# ========================================
# TIMEOUT CONFIGURATION (seconds)
# ========================================
implicit.wait=5
explicit.wait=10
page.load.timeout=30

# ========================================
# TEST DATA
# ========================================
test.search.term=Selenium WebDriver
# Credentials resolve from environment variables - never commit real values here.
# Set them before running:  export TEST_LEARNER_EMAIL=... TEST_LEARNER_PASSWORD=...
# A single run can also override with: -Dtest.learner.password=...
test.learner.email=${TEST_LEARNER_EMAIL}
test.learner.password=${TEST_LEARNER_PASSWORD}

# ========================================
# TEST DATA
# ========================================
test.learner.active.course.page.header.name=Active Courses

# ========================================
# REPORTING CONFIGURATION
# ========================================
reports.path=test-output/extent-reports
screenshots.path=test-output/screenshots

# ========================================
# LOGGING CONFIGURATION
# ========================================
log.level=INFO

# ========================================
# Auto-open report after test execution
# ========================================
auto.open.report=false