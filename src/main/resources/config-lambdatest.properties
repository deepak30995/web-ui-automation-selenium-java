# ========================================
# LAMBDATEST CONFIGURATION
# ========================================
execution.mode=lambdatest
browser=chrome
headless=false

# LambdaTest Credentials (using environment variables)
lambdatest.username=${LAMBDATEST_USERNAME}
lambdatest.accesskey=${LAMBDATEST_ACCESS_KEY}

# LambdaTest Specific Settings
browser.version=latest
platform.name=macOS Monterey

# ========================================
# APPLICATION CONFIGURATION
# ========================================
base.url=${BASE_URL}
environment=LAMBDATEST

# ========================================
# TIMEOUT CONFIGURATION
# ========================================
implicit.wait=5
explicit.wait=10
page.load.timeout=30

# ========================================
# TEST DATA
# ========================================
test.learner.email=software.testing30995@gmail.com
test.learner.password=pass
test.learner.active.course.page.header.name=Active Courses

# ========================================
# PROJECT INFORMATION
# ========================================
project.name=Selenium POM Framework - LambdaTest
build.name=LambdaTest-Build-${BUILD_NUMBER:1.0}