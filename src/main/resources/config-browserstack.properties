# ========================================
# BROWSERSTACK CONFIGURATION
# ========================================
execution.mode=browserstack
browser=chrome
headless=false

# BrowserStack Credentials (using environment variables)
browserstack.username=${BROWSERSTACK_USERNAME}
browserstack.accesskey=${BROWSERSTACK_ACCESS_KEY}

# BrowserStack Specific Settings
browser.version=latest
os.name=OS X
os.version=Monterey
platform.name=macOS Monterey

# ========================================
# APPLICATION CONFIGURATION
# ========================================
base.url=${BASE_URL}
environment=BROWSERSTACK

# ========================================
# TIMEOUT CONFIGURATION
# ========================================
# Must stay 0: mixing an implicit wait with explicit waits makes every explicit poll
# block for the implicit duration, so a 500ms poll effectively becomes 5s. All waiting
# is done explicitly in BasePage.
implicit.wait=0
explicit.wait=30
page.load.timeout=30

# ========================================
# TEST DATA
# ========================================
# Credentials resolve from environment variables or the git-ignored secrets.properties.
# Never commit real values here.
test.learner.email=${TEST_LEARNER_EMAIL}
test.learner.password=${TEST_LEARNER_PASSWORD}
test.learner.active.course.page.header.name=Active Courses

# ========================================
# PROJECT INFORMATION
# ========================================
project.name=Selenium POM Framework - BrowserStack
build.name=BrowserStack-Build-${BUILD_NUMBER:1.0}