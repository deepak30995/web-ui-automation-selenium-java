# ========================================
# LOCAL EXECUTION CONFIGURATION
# ========================================
execution.mode=local
browser=chrome
headless=false

# ========================================
# APPLICATION CONFIGURATION
# ========================================
# Target environment under test - staging or prod. Override per run with -Dtarget.env=prod
target.env=staging
base.url.staging=${STAGING_BASE_URL}
base.url.prod=${PROD_BASE_URL}
environment=LOCAL

# ========================================
# TIMEOUT CONFIGURATION
# ========================================
# Must stay 0: mixing an implicit wait with explicit waits makes every explicit poll
# block for the implicit duration, so a 500ms poll effectively becomes 5s. All waiting
# is done explicitly in BasePage.
implicit.wait=0
explicit.wait=30

# Retries for flaky failures. Only WebDriver errors are retried -
# assertion failures never are, so a real regression cannot be hidden.
retry.count=1
page.load.timeout=30

# ========================================
# PROJECT INFORMATION
# ========================================
project.name=Selenium POM Framework - Local
build.name=Local-Build-${BUILD_NUMBER:1.0}

# ========================================
# TEST DATA
# ========================================
test.search.term=Selenium WebDriver

# Credentials and accounts resolve per target environment (see target.env above) from
# environment variables or the git-ignored secrets.properties. Never commit real values.
test.user.email.staging=${STAGING_USER_EMAIL}
test.user.password.staging=${STAGING_USER_PASSWORD}
test.user.email.prod=${PROD_USER_EMAIL}
test.user.password.prod=${PROD_USER_PASSWORD}

test.admin.email.staging=${STAGING_ADMIN_EMAIL}
test.admin.password.staging=${STAGING_ADMIN_PASSWORD}
test.admin.email.prod=${PROD_ADMIN_EMAIL}
test.admin.password.prod=${PROD_ADMIN_PASSWORD}

# Address deliberately not tied to any account, for negative login coverage
test.incorrect.email.staging=${STAGING_INCORRECT_EMAIL}
test.incorrect.email.prod=${PROD_INCORRECT_EMAIL}

test.user.active.course.page.header.name=Courses

# Expected validation messages
incorrect.email.and.incorrect.password.error.toast.message=The email that you entered does not belong to any account. If you are a new user, please create an account.
correct.email.and.incorrect.password.error.toast.message=The password you entered is incorrect.
