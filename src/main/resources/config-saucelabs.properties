# ========================================
# SAUCE LABS CONFIGURATION
# ========================================
execution.mode=saucelabs
browser=chrome
headless=false

# Sauce Labs Credentials (using environment variables)
saucelabs.username=${SAUCELABS_USERNAME}
saucelabs.accesskey=${SAUCELABS_ACCESS_KEY}

# Sauce Labs Specific Settings
browser.version=latest
platform.name=macOS 12

# ========================================
# APPLICATION CONFIGURATION
# ========================================
base.url=${BASE_URL}
environment=SAUCELABS

# ========================================
# TIMEOUT CONFIGURATION
# ========================================
implicit.wait=5
explicit.wait=10
page.load.timeout=30

# ========================================
# TEST DATA
# ========================================
test.learner.email=software.testing30995@gmail.com
test.learner.password=pass
test.learner.active.course.page.header.name=Active Courses

# ========================================
# PROJECT INFORMATION
# ========================================
project.name=Selenium POM Framework - Sauce Labs
build.name=SauceLabs-Build-${BUILD_NUMBER:1.0}