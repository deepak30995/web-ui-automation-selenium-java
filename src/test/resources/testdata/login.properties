# ---------------------------------------------------------------------------
# Test data for the login feature.
#
# Every *.properties file in this directory is merged into the configuration at
# startup, so a new feature or product adds a file here and nothing else: no
# edit to config.properties, no framework change, no registration step.
#
# Keys support the same ${VAR} placeholders and .staging / .prod suffixes as the
# main config, so values that differ per environment can be split by suffix and
# read with ConfigReader.getForTarget("key").
# ---------------------------------------------------------------------------

# Header shown on the courses page once a user with an active course logs in
test.user.active.course.page.header.name=Courses

# Expected validation toasts. These are the application's own wording - if the
# app says something different, that is a finding to report, never a value to
# edit until the test goes green.
incorrect.email.and.incorrect.password.error.toast.message=The email that you entered does not belong to any account. If you are a new user, please create an account.
correct.email.and.incorrect.password.error.toast.message=The password you entered is incorrect.
